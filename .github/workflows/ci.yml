name: Toolshop automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Toolshop environment to test
        type: choice
        options:
          - stable
          - with-bugs
        default: stable
      publish_report:
        description: Publish the dashboard to GitHub Pages
        type: boolean
        default: true
      browser_matrix:
        description: Run Playwright UI suites in Chromium, Firefox, and WebKit
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        description: Toolshop environment to test
        type: string
        required: false
        default: stable
      publish_report:
        description: Publish the dashboard to GitHub Pages
        type: boolean
        required: false
        default: false
      browser_matrix:
        description: Run Playwright UI suites in Chromium, Firefox, and WebKit
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: toolshop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hybrid:
    name: Vibium and hybrid smoke
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      TOOLSHOP_TARGET: ${{ inputs.target || 'stable' }}
    outputs:
      report_artifact: toolshop-${{ inputs.target || 'stable' }}-hybrid-reports-${{ github.run_attempt }}
      hermetic_status: ${{ steps.hermetic_hybrid.outcome }}
      site_health: ${{ steps.site_health.outcome }}
      live_status: ${{ steps.live_vibium.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx vibium install
      - name: Run hermetic hybrid smoke
        id: hermetic_hybrid
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_REPORT: reports/hermetic-hybrid.json
        run: npm run test:hybrid:hermetic
      - name: Upload hermetic hybrid evidence
        if: ${{ always() && steps.hermetic_hybrid.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: toolshop-${{ env.TOOLSHOP_TARGET }}-hermetic-hybrid-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Check target UI health for Vibium
        id: site_health
        continue-on-error: true
        run: npm run healthcheck:site
      - name: Run live Vibium and hybrid smoke
        id: live_vibium
        if: steps.site_health.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_REPORT: reports/vibium.json
        run: node scripts/run-target.mjs "${{ env.TOOLSHOP_TARGET }}" tests/vibium tests/hybrid
      - name: Upload live Vibium evidence
        if: ${{ always() && steps.live_vibium.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: toolshop-${{ env.TOOLSHOP_TARGET }}-live-vibium-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Record unavailable Vibium target
        if: ${{ always() && steps.site_health.outcome != 'success' }}
        run: '"Vibium live checks did not run because their UI health check did not pass." >> $env:GITHUB_STEP_SUMMARY'
      - name: Upload hybrid reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolshop-${{ env.TOOLSHOP_TARGET }}-hybrid-reports-${{ github.run_attempt }}
          path: |
            reports/hermetic-hybrid.json
            reports/vibium.json
          if-no-files-found: warn
          retention-days: 14

  test:
    needs: hybrid
    if: ${{ always() && needs.hybrid.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      TOOLSHOP_TARGET: ${{ inputs.target || 'stable' }}
      TOOLSHOP_BROWSER_MATRIX: ${{ inputs.browser_matrix && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Install additional Playwright browsers
        if: inputs.browser_matrix
        run: npx playwright install --with-deps firefox webkit
      - name: Download hybrid reports
        if: ${{ always() && needs.hybrid.outputs.report_artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.hybrid.outputs.report_artifact }}
          path: reports
      - name: Run hermetic gate
        env:
          PLAYWRIGHT_JSON_REPORT: reports/hermetic.json
        run: npm run test:hermetic
      - name: Start self-hosted Toolshop SUT
        id: sut
        continue-on-error: true
        timeout-minutes: 12
        run: npm run sut:up
      - name: Run API and contract regression on self-hosted SUT
        id: sut_api
        if: steps.sut.outcome == 'success'
        env:
          PLAYWRIGHT_JSON_REPORT: reports/sut-api.json
        run: node scripts/run-target.mjs local tests/api tests/contract tests/security
      - name: Run E2E checkout journey on self-hosted SUT
        id: sut_e2e
        if: always() && steps.sut.outcome == 'success'
        env:
          PLAYWRIGHT_JSON_REPORT: reports/sut-e2e.json
        run: node scripts/run-target.mjs local tests/e2e
      - name: Run non-functional checks on self-hosted SUT
        id: sut_nonfunctional
        if: always() && steps.sut.outcome == 'success'
        env:
          PLAYWRIGHT_JSON_REPORT: reports/sut-nonfunctional.json
        run: node scripts/run-target.mjs local tests/nonfunctional
      - name: Dump SUT logs on failure
        if: ${{ always() && steps.sut.outcome == 'failure' }}
        run: docker compose -f docker/compose.yml logs --tail=200
      - name: Stop self-hosted SUT
        if: ${{ always() && steps.sut.outcome != 'skipped' }}
        run: npm run sut:down
      - name: Check public API health
        id: api_health
        continue-on-error: true
        run: npm run healthcheck:api
      - name: Check target UI health
        id: site_health
        continue-on-error: true
        run: npm run healthcheck:site
      - name: Run live API regression
        id: live_api
        # Public environments are shared and mutable: informative, never a merge gate.
        continue-on-error: true
        if: steps.api_health.outcome == 'success'
        env:
          PLAYWRIGHT_JSON_REPORT: reports/live-api.json
        run: node scripts/run-target.mjs "${{ env.TOOLSHOP_TARGET }}" tests/api
      - name: Run live UI regression
        id: live_ui
        # Public environments are shared and mutable: informative, never a merge gate.
        continue-on-error: true
        if: steps.site_health.outcome == 'success'
        env:
          PLAYWRIGHT_JSON_REPORT: reports/live-ui.json
        run: node scripts/run-target.mjs "${{ env.TOOLSHOP_TARGET }}" tests/e2e
      - name: Record unavailable external target
        if: steps.api_health.outcome != 'success' || steps.site_health.outcome != 'success'
        run: |
          echo "Some live suites were skipped because their API or UI health check failed. Hermetic gate still ran." >> "$GITHUB_STEP_SUMMARY"
      - name: Build unified report
        if: always()
        env:
          TOOLSHOP_INFRA_STATUS: >-
            sut=${{ steps.sut.outcome }}; sut_api=${{ steps.sut_api.outcome }};
            sut_e2e=${{ steps.sut_e2e.outcome }}; sut_nonfunctional=${{ steps.sut_nonfunctional.outcome }};
            live_api=${{ steps.live_api.outcome }}; live_ui=${{ steps.live_ui.outcome }};
            api=${{ steps.api_health.outcome }}; site=${{ steps.site_health.outcome }};
            vibium_job=${{ needs.hybrid.result }}; vibium_hermetic=${{ needs.hybrid.outputs.hermetic_status }};
            vibium_site=${{ needs.hybrid.outputs.site_health }}; vibium_live=${{ needs.hybrid.outputs.live_status }}
          TOOLSHOP_REPORT_FILES: >-
            reports/hermetic.json;reports/hermetic-hybrid.json;local=reports/sut-api.json;
            local=reports/sut-e2e.json;local=reports/sut-nonfunctional.json;
            reports/live-api.json;reports/live-ui.json;reports/vibium.json
        run: npm run report:build
      - name: Build dashboard
        if: always() && hashFiles('reports/unified-report.json') != ''
        run: npm run dashboard:build
      - name: Upload reports and Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolshop-${{ env.TOOLSHOP_TARGET }}-reports
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Configure GitHub Pages
        if: ${{ always() && (github.event_name == 'push' || inputs.publish_report) && hashFiles('site/index.html') != '' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ always() && (github.event_name == 'push' || inputs.publish_report) && hashFiles('site/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ always() && needs.test.result != 'cancelled' && (github.event_name == 'push' || inputs.publish_report) }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report dashboard
        id: deployment
        uses: actions/deploy-pages@v4
