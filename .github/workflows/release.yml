name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install chromium
      - name: Run hermetic gate
        run: npm run test:hermetic -- --workers=2
      - name: Build release notes and SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          awk -v heading="## ${TAG#v}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}."
            exit 1
          fi
          {
            echo
            echo "Live report: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> release/notes.md
          npm sbom --omit=dev --sbom-format=cyclonedx > release/sbom.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/sbom.cdx.json --clobber
            gh release edit "$TAG" --notes-file release/notes.md
          else
            gh release create "$TAG" release/sbom.cdx.json \
              --title "$TAG" --notes-file release/notes.md --verify-tag
          fi
