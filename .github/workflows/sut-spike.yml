name: SUT spike

on:
  workflow_dispatch:
  push:
    paths:
      - docker/**
      - scripts/sut.mjs
      - .github/workflows/sut-spike.yml

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start self-hosted Toolshop
        run: node scripts/sut.mjs up
      - name: Probe endpoints
        run: |
          set -x
          curl -sS -o /dev/null -w "%{http_code} %{time_total}s products\n" http://localhost:8091/products
          curl -sS http://localhost:8091/products?page=1 | head -c 400; echo
          curl -sS -o /dev/null -w "%{http_code} swagger\n" http://localhost:8091/api/documentation
          curl -sS -o /tmp/openapi.json -w "%{http_code} openapi json\n" http://localhost:8091/docs/api-docs.json || true
          head -c 300 /tmp/openapi.json || true; echo
          curl -sS -X POST http://localhost:8091/users/login -H 'Content-Type: application/json' \
            -d '{"email":"customer@practicesoftwaretesting.com","password":"welcome01"}' | head -c 200; echo
          curl -sS http://localhost:4200 | head -c 600; echo
      - name: Container status
        if: always()
        run: docker compose -f docker/compose.yml ps; docker compose -f docker/compose.yml logs --tail 40
      - name: Stop
        if: always()
        run: node scripts/sut.mjs down
