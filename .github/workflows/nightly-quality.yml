name: Nightly load and security scan

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: false

jobs:
  load-and-dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start self-hosted Toolshop SUT
        id: sut
        run: npm run sut:up
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
      - name: k6 smoke test
        id: smoke
        run: k6 run --env LOAD_PROFILE=smoke --summary-export reports/k6-smoke.json tests/load/catalog.k6.js
      - name: k6 load test (thresholds gate the job)
        id: load
        if: steps.smoke.outcome == 'success'
        run: k6 run --summary-export reports/k6-summary.json tests/load/catalog.k6.js
      - name: OWASP ZAP baseline scan (report only)
        id: zap
        if: always() && steps.sut.outcome == 'success'
        run: |
          mkdir -p reports
          cp tests/security/zap-rules.tsv reports/zap-rules.tsv
          chmod 777 reports
          set +e
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:4200 -c zap-rules.tsv -I -r zap-report.html -J zap-report.json
          result=$?
          set -e
          if [ "$result" -gt 2 ] || [ ! -s reports/zap-report.json ]; then
            echo "::error::ZAP did not produce a usable report (exit $result)."
            exit 1
          fi
          echo "ZAP findings are reported for triage; scan exit code: $result."
      - name: Lighthouse desktop budgets
        id: lighthouse
        if: always() && steps.sut.outcome == 'success'
        run: |
          npm run lighthouse:collect
          npm run lighthouse:report
      - name: Record nightly stage outcomes
        if: always()
        env:
          SUT_STATUS: ${{ steps.sut.outcome }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
          LOAD_STATUS: ${{ steps.load.outcome }}
          ZAP_STATUS: ${{ steps.zap.outcome }}
          LIGHTHOUSE_STATUS: ${{ steps.lighthouse.outcome }}
        run: |
          mkdir -p reports
          node -e "const fs=require('node:fs'); fs.writeFileSync('reports/nightly-status.json', JSON.stringify({sut:process.env.SUT_STATUS,smoke:process.env.SMOKE_STATUS,load:process.env.LOAD_STATUS,zap:process.env.ZAP_STATUS,lighthouse:process.env.LIGHTHOUSE_STATUS},null,2));"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-quality-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop SUT
        if: always()
        run: npm run sut:down
