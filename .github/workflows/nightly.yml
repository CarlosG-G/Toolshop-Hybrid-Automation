name: Toolshop nightly comparison

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  visual:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolshop-visual-baseline
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  stable:
    uses: ./.github/workflows/ci.yml
    with:
      target: stable
      publish_report: true
      browser_matrix: true
  with_bugs:
    name: with-bugs
    uses: ./.github/workflows/ci.yml
    with:
      target: with-bugs
      publish_report: false
      browser_matrix: true

  compare:
    if: ${{ always() && needs.stable.result != 'cancelled' && needs.with_bugs.result != 'cancelled' }}
    needs: [stable, with_bugs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download stable report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolshop-stable-reports
          path: reports/stable
      - name: Download with-bugs report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolshop-with-bugs-reports
          path: reports/with-bugs
      - name: Build comparison report
        if: always()
        env:
          TOOLSHOP_INFRA_STATUS: matrix; see missing report list for unavailable target runs
          TOOLSHOP_REPORT_FILES: >-
            stable=reports/stable/reports/hermetic.json;
            stable=reports/stable/reports/hermetic-hybrid.json;
            stable=reports/stable/reports/live-api.json;
            stable=reports/stable/reports/live-ui.json;
            stable=reports/stable/reports/vibium.json;
            with-bugs=reports/with-bugs/reports/hermetic.json;
            with-bugs=reports/with-bugs/reports/hermetic-hybrid.json;
            with-bugs=reports/with-bugs/reports/live-api.json;
            with-bugs=reports/with-bugs/reports/live-ui.json;
            with-bugs=reports/with-bugs/reports/vibium.json
        run: |
          npm run traceability
          npm run report:build
          npm run report:exit
      - name: Build dashboard
        if: always() && hashFiles('reports/unified-report.json') != ''
        run: npm run dashboard:build
      - name: Upload nightly comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolshop-nightly-comparison
          path: |
            reports/unified-report.json
            reports/unified-report.md
            site/
          if-no-files-found: warn
          retention-days: 30
